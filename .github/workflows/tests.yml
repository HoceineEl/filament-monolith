name: tests

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    tests:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: ['8.3', '8.4', '8.5']
                laravel: ['12.*', '13.*']
                filament: ['4.*', '5.*']
                include:
                    - laravel: '12.*'
                      testbench: '10.*'
                    - laravel: '13.*'
                      testbench: '11.*'

        name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · Filament ${{ matrix.filament }}

        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, fileinfo, intl, mbstring, pdo_sqlite, sqlite3
                  coverage: none

            - name: Install dependencies
              run: |
                  composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "filament/filament:${{ matrix.filament }}" --no-interaction --no-update
                  composer update --prefer-dist --no-interaction --no-progress -W

            - name: Tests
              run: vendor/bin/pest --parallel

    quality:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
              with:
                  php-version: '8.4'
                  coverage: none

            - run: composer install --prefer-dist --no-interaction --no-progress

            - name: Pint
              run: vendor/bin/pint --test

            - name: PHPStan
              run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

    assets:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: '22'
                  cache: npm

            - run: npm ci

            - name: Built CSS is up to date
              run: |
                  npm run build
                  git diff --exit-code resources/dist

    e2e:
        runs-on: ubuntu-latest

        name: End to end (Playwright)

        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
              with:
                  php-version: '8.4'
                  extensions: dom, fileinfo, intl, mbstring, pdo_sqlite, sqlite3
                  coverage: none

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: '22'
                  cache: npm

            - run: composer install --prefer-dist --no-interaction --no-progress

            - run: npm ci

            - run: npx playwright install --with-deps chromium

            - name: Generate missing Linux baselines
              id: baselines
              if: hashFiles('tests/e2e/__screenshots__/**/*-linux.png') == ''
              run: npm run test:e2e -- visual --update-snapshots=all --retries=0

            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              if: steps.baselines.outcome == 'success'
              with:
                  name: linux-baselines
                  path: tests/e2e/__screenshots__

            - name: Playwright
              run: npm run test:e2e

            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              if: failure()
              with:
                  name: playwright-results
                  path: test-results
                  retention-days: 7
